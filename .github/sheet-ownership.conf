# Which KiCad files a feature branch may change.
#
#   <feature> = <file or glob, relative to repo root>
#
# Branch feature/<feature> may only modify protected KiCad files
# (*.kicad_sch, *.kicad_pcb, *.kicad_pro, *.kicad_dru, *.kicad_sym, *-lib-table)
# that match one of its lines. Repeat a feature name for several files.
# Spaces inside file names are fine; no quotes needed.
#
# Files NOT listed for any feature (root sheet, parent sheets with the sheet
# symbols, .kicad_pro, .kicad_pcb ...) are shared: change them only on dev
# (or on an integration/* branch, which this guard does not check).
#
# Edit this file on dev, together with creating the empty sheet, BEFORE the
# feature branch is cut. See docs/WORKFLOW.md.

